name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday

jobs:
  check-secrets:
    name: Check for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          echo "Checking for common secret patterns..."
          FOUND=0
          # Check for API keys
          if grep -rn "AIzaSy" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" . 2>/dev/null | grep -v node_modules | grep -v .git; then
            echo "::error::Google API key found in source!"
            FOUND=1
          fi
          # Check for private keys files
          if [ -f "packages/api-server/private_keys.json" ]; then
            echo "::error::private_keys.json should not be in repo!"
            FOUND=1
          fi
          # Check for hardcoded passwords
          if grep -rn 'password.*=.*"[^"]\{4,\}"' --include="*.py" . 2>/dev/null | grep -v node_modules | grep -v .git | grep -v "get_password_hash" | grep -v "verify_password"; then
            echo "::warning::Possible hardcoded password found"
          fi
          if [ $FOUND -eq 1 ]; then exit 1; fi
          echo "No leaked secrets found."

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r packages/api-server/requirements.txt --ignore-vuln PYSEC-2024-* || true
